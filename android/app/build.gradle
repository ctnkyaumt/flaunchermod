def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def secretProperties = new Properties()
secretProperties.setProperty("signing_keystore_password", "${System.getenv('SIGNING_KEYSTORE_PASSWORD')}")
secretProperties.setProperty("signing_key_password", "${System.getenv('SIGNING_KEY_PASSWORD')}")
secretProperties.setProperty("signing_key_alias", "${System.getenv('SIGNING_KEY_ALIAS')}")

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    compileSdkVersion 33

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // The Shizuku user service talks to the app over AIDL.
    buildFeatures {
        aidl true
    }

    defaultConfig {
        applicationId "me.efesser.flauncher"
        // 24 is the floor for the Shizuku api, and every Android TV device this
        // fork targets is well past it. Upstream FLauncher still allows 21.
        minSdkVersion 24
        targetSdkVersion 33
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        debug {}
        release {
            // Try to read keystore properties from environment variables
            // or alternatively from a properties file.
            storeFile file('upload-keystore.jks') // Assumes keystore is placed here by CI
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // Runs a helper process at shell privilege, which is what it takes to read
    // /dev/input directly. See RawInputService. Used when Shizuku happens to be
    // installed; the ADB path below needs no second app at all.
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"

    // Talks to the device's own adbd over loopback, so the launcher can get
    // shell privilege on its own. See AdbInputBridge.
    implementation "com.github.MuntashirAkon:libadb-android:1.0.1"
    // Supplies the sun.security.x509 classes the AOSP libcore removed, which
    // AdbConnectionManager needs to build its client certificate. This is the
    // alternative to pulling in BouncyCastle, whose current builds ship Java 21
    // bytecode that Jetifier refuses.
    implementation "com.github.MuntashirAkon:sun-security-android:1.1"
}
